<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>pi-cloud-sync · 用量看板</title>
<style>
  :root {
    --bg: #0d1017; --bg-2: #10141d; --panel: #151a24; --panel-2: #1a2130;
    --border: #232b3a; --border-2: #2e394d;
    --text: #dbe2ee; --muted: #8391a8; --dim: #5b6c80;
    --accent: #4cc2ff; --accent-2: #7ca2ff; --accent-dim: #1f5a7c;
    --ok: #4ade80; --warn: #fbbf24; --err: #ff6b6b; --violet: #a78bfa; --pink: #f472b6;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
    --radius: 12px;
    --bg-glow: #14233a;
    --header-bg: rgba(13,16,23,.85);
    --hover-bg: rgba(76,194,255,.05);
    --msg-user-bg: #1e2a3a; --msg-assistant-bg: #18202c; --msg-tool-bg: #232a36;
  }
  /* 亮色主题：html[data-theme="light"] 时生效（默认/暗色使用上方 :root） */
  html[data-theme="light"] {
    --bg: #f5f7fa; --bg-2: #e9edf3; --panel: #ffffff; --panel-2: #f1f4f9;
    --border: #dde3ec; --border-2: #c3cddb;
    --text: #1c2430; --muted: #5a6a7d; --dim: #8b98a9;
    --accent: #0f8fd9; --accent-2: #5b7cf8; --accent-dim: #bcdff4;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626; --violet: #7c5cd6; --pink: #d4559b;
    --shadow: 0 6px 24px rgba(20,30,50,.10);
    --bg-glow: #dcebf7;
    --header-bg: rgba(255,255,255,.88);
    --hover-bg: rgba(15,143,217,.06);
    --msg-user-bg: #e4eef8; --msg-assistant-bg: #eef1f6; --msg-tool-bg: #f4eee3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  body { background: radial-gradient(1200px 500px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%); background-attachment: fixed; color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- header ---------- */
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; background: var(--header-bg); backdrop-filter: blur(8px); z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 0 14px rgba(76,194,255,.35); }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; padding: 14px 24px 0; max-width: 1240px; margin: 0 auto; }
  .tab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 8px 18px; border-radius: 10px 10px 0 0; font-size: 13.5px; cursor: pointer; transition: all .18s ease; }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab.active { color: var(--accent); background: var(--panel); border-color: var(--border); border-bottom-color: var(--panel); font-weight: 600; }

  /* ---------- layout ---------- */
  main { max-width: 1240px; margin: 0 auto; padding: 18px 24px 60px; }
  .hidden { display: none !important; }

  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .chip-group { display: flex; gap: 4px; background: var(--bg-2); padding: 3px; border-radius: 9px; }
  .chip { border: none; background: transparent; color: var(--muted); padding: 5px 13px; border-radius: 7px; font-size: 12.5px; cursor: pointer; transition: all .15s ease; }
  .chip:hover { color: var(--text); }
  .chip.active { background: linear-gradient(135deg, var(--accent-dim), #16405c); color: #dff3ff; font-weight: 600; box-shadow: 0 2px 8px rgba(76,194,255,.25); }
  html[data-theme="light"] .chip.active { color: #0b5f8f; box-shadow: 0 2px 8px rgba(15,143,217,.18); }
  select { background: var(--bg-2); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; outline: none; }
  select:hover { border-color: var(--accent-dim); }
  .auto-refresh { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .auto-refresh input { accent-color: var(--accent); }
  .btn { background: var(--bg-2); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; transition: all .15s ease; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent-dim), #16405c); border-color: var(--accent-dim); color: #dff3ff; font-weight: 600; }
  html[data-theme="light"] .btn.primary { color: #0b5f8f; }

  /* ---------- stat cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card-mini { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
  .card-mini:hover { transform: translateY(-2px); border-color: var(--border-2); }
  .card-mini::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tint, var(--accent)); opacity: .8; }
  .card-mini .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card-mini .v { font-size: 21px; font-weight: 700; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  .card-mini .v small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .card-mini .d { font-size: 11px; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---------- panels / grids ---------- */
  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-bottom: 14px; }
  .grid.reverse { grid-template-columns: 2fr 3fr; }
  @media (max-width: 980px) { .grid, .grid.reverse { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-height: 120px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-head h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .seg { display: flex; gap: 3px; background: var(--bg-2); padding: 2px; border-radius: 8px; }
  .seg button { border: none; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .15s ease; }
  .seg button.active { background: var(--accent-dim); color: #dff3ff; font-weight: 600; }
  html[data-theme="light"] .seg button.active { color: #0b5f8f; }
  .empty-state { color: var(--dim); text-align: center; padding: 36px 10px; font-size: 13px; }
  .loading { text-align: center; padding: 30px; color: var(--muted); }
  .loading .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border-2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -4px; margin-right: 8px; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- svg chart ---------- */
  .chart { width: 100%; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .axis { fill: var(--dim); font-size: 10px; font-family: inherit; }
  .chart .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart .bar { transition: opacity .15s ease; }
  .chart .bar:hover { opacity: .85; }
  .chart .bar.tokens { fill: url(#trendGrad); }
  .chart .bar.cost { fill: url(#costGrad); }
  .chart .bar.zero { fill: var(--border); }
  .chart-title { font-size: 11px; color: var(--dim); margin-top: 4px; text-align: right; }

  /* ---------- horizontal bars ---------- */
  .hbar-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
  .hbar-row { display: grid; grid-template-columns: 110px 1fr 74px; align-items: center; gap: 10px; font-size: 12.5px; }
  .hbar-label { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track { background: var(--bg-2); border-radius: 6px; height: 14px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transform-origin: left; animation: growX .7s cubic-bezier(.2,.8,.25,1); min-width: 2px; }
  .hbar-fill.cost { background: linear-gradient(90deg, #8a5a10, var(--warn)); }
  .hbar-fill.violet { background: linear-gradient(90deg, #5b3f9e, var(--violet)); }
  .hbar-val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .more-note { color: var(--dim); font-size: 11.5px; margin-top: -6px; margin-bottom: 8px; }
  @keyframes growX { from { transform: scaleX(0); } }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; background: var(--bg-2); position: sticky; top: 0; }
  td.num, th.num { text-align: right; }
  tr:hover td { background: var(--hover-bg); }
  .cost-cell { color: var(--warn); }
  .tok-cell { color: var(--accent); }
  .breakdown { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .breakdown thead th:first-child { border-radius: 10px 0 0 0; }
  .breakdown thead th:last-child { border-radius: 0 10px 0 0; }

  /* ---------- recent sessions ---------- */
  .recent-list { display: flex; flex-direction: column; }
  .recent-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background .15s ease; border-bottom: 1px solid var(--border); }
  .recent-item:last-child { border-bottom: none; }
  .recent-item:hover { background: var(--hover-bg); }
  .recent-item .icon { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .recent-item .t { flex: 1; min-width: 0; }
  .recent-item .t .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .t .meta { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .cnt { color: var(--muted); font-size: 12px; flex-shrink: 0; }

  /* ---------- sessions tab ---------- */
  .searchbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .searchbar input { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; }
  .searchbar input:focus { border-color: var(--accent-dim); }
  .checkbox { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .checkbox input { accent-color: var(--accent); }
  .sess-table { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .sess-table th, .sess-table td { padding: 10px 14px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--hover-bg); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--accent-dim); color: var(--accent); }
  .badge.deleted { background: #3a2226; color: var(--err); }
  .badge.ok { background: #16331f; color: var(--ok); }
  html[data-theme="light"] .badge.deleted { background: #fde8e8; }
  html[data-theme="light"] .badge.ok { background: #e4f5e9; }
  .back { margin-bottom: 12px; }
  .sess-head { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .sess-head h2 { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .msg { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--panel); }
  .msg-head { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; font-size: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .msg.role-user .msg-head { background: var(--msg-user-bg); }
  .msg.role-assistant .msg-head { background: var(--msg-assistant-bg); }
  .msg.role-toolResult .msg-head, .msg.type-tool .msg-head { background: var(--msg-tool-bg); }
  .msg-body { padding: 10px 14px; white-space: pre-wrap; word-break: break-word; font-size: 13px; color: #c9d3e2; }
  .msg.role-assistant .msg-body { color: #dbe2ec; }
  html[data-theme="light"] .msg-body { color: #333c4b; }
  html[data-theme="light"] .msg.role-assistant .msg-body { color: #1c2430; }
  .msg.type-compaction, .msg.type-branch_summary { border-left: 3px solid var(--warn); }
  .msg.type-compaction .msg-body, .msg.type-branch_summary .msg-body { color: var(--muted); font-style: italic; }
  .role-tag { font-weight: 600; }
  .role-user .role-tag { color: var(--accent); }
  .role-assistant .role-tag { color: var(--ok); }
  .role-toolResult .role-tag { color: var(--warn); }
  .meta { color: var(--muted); margin-left: auto; text-align: right; }
  .usage { color: var(--muted); font-size: 11px; }
  .usage .tok { color: var(--accent); }
  .usage .cst { color: var(--warn); }
  .err { color: var(--err); padding: 8px 0; }
  .pager { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }

  /* ---------- token prompt ---------- */
  .token-prompt { max-width: 420px; margin: 80px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px; text-align: center; box-shadow: var(--shadow); }
  .token-prompt .logo { margin: 0 auto 14px; width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
  .token-prompt h2 { margin-bottom: 6px; font-size: 16px; }
  .token-prompt input { width: 100%; margin: 14px 0; background: var(--bg-2); border: 1px solid var(--border-2); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
  .token-prompt input:focus { border-color: var(--accent); }

  .footer { text-align: center; color: var(--dim); font-size: 12px; padding: 20px 0 30px; }
  .range-note { font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">☁</div>
    <div>
      <h1>pi-cloud-sync 用量看板</h1>
      <div class="sub" id="serverLabel"></div>
    </div>
  </div>
  <div class="spacer"></div>
  <select id="themeSelect" title="主题：跟随系统 / 亮色 / 暗色">
    <option value="system">🌓 跟随系统</option>
    <option value="light">☀️ 亮色</option>
    <option value="dark">🌙 暗色</option>
  </select>
  <button id="btnRefresh" class="btn hidden">⟳ 刷新</button>
  <button id="btnLogout" class="btn hidden">切换令牌</button>
</header>

<!-- 令牌输入（独立于 #app：切换令牌时不再被主界面隐藏） -->
<div id="tokenPrompt" class="token-prompt hidden">
  <div class="logo">☁</div>
  <h2 id="tokenTitle">输入访问令牌</h2>
  <p class="muted">Token 仅保存在本浏览器 localStorage，不会上传到别处。</p>
  <input type="password" id="tokenInput" placeholder="访问令牌 (SYNC_TOKEN)" autocomplete="off">
  <button class="btn primary" id="btnToken" style="width:100%">连接</button>
</div>

<main id="app" class="hidden">

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">📊 用量总览</button>
    <button class="tab" data-tab="sessions">💬 会话</button>
  </nav>

  <!-- ============ 总览 ============ -->
  <section id="tab-overview" class="tab-panel">
    <div class="filter-bar">
      <div class="chip-group" id="rangeChips">
        <button class="chip" data-days="1">1天</button>
        <button class="chip active" data-days="7">7天</button>
        <button class="chip" data-days="30">30天</button>
        <button class="chip" data-days="all">全部</button>
      </div>
      <select id="deviceSelect" title="按客户端筛选"><option value="">全部客户端</option></select>
      <select id="modelSelect" title="按模型筛选"><option value="">全部模型</option></select>
      <div class="spacer"></div>
      <span class="range-note" id="rangeNote"></span>
      <label class="auto-refresh"><input type="checkbox" id="autoRefresh"> 自动刷新</label>
    </div>

    <div class="cards" id="statCards"></div>

    <div class="grid">
      <div class="card">
        <div class="card-head">
          <h3><span class="dot"></span>每日用量趋势</h3>
          <div class="seg" id="trendMetric">
            <button data-metric="tokens" class="active">Tokens</button>
            <button data-metric="cost">金额</button>
          </div>
        </div>
        <div id="trendChart"><div class="empty-state">加载中…</div></div>
        <div class="chart-title" id="trendTitle"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3><span class="dot" style="background:var(--violet);box-shadow:0 0 8px var(--violet)"></span>分模型</h3></div>
        <div id="modelBars"><div class="empty-state">加载中…</div></div>
        <div class="more-note" id="modelNote"></div>
        <table class="breakdown" id="modelTable"></table>
      </div>
    </div>

    <div class="grid reverse">
      <div class="card">
        <div class="card-head"><h3><span class="dot" style="background:var(--ok);box-shadow:0 0 8px var(--ok)"></span>分设备（客户端）</h3></div>
        <div id="deviceBars"><div class="empty-state">加载中…</div></div>
        <div class="more-note" id="deviceNote"></div>
        <table class="breakdown" id="deviceTable"></table>
      </div>
      <div class="card">
        <div class="card-head"><h3><span class="dot" style="background:var(--warn);box-shadow:0 0 8px var(--warn)"></span>最近会话</h3></div>
        <div class="recent-list" id="recentList"><div class="empty-state">加载中…</div></div>
      </div>
    </div>
  </section>

  <!-- ============ 会话 ============ -->
  <section id="tab-sessions" class="tab-panel hidden">
    <div id="listView">
      <div class="searchbar">
        <input id="searchInput" placeholder="搜索名称 / 路径 / uuid…">
        <label class="checkbox"><input type="checkbox" id="showDeleted"> 显示已删除</label>
      </div>
      <div class="sess-table" style="overflow:auto">
        <table>
          <thead><tr><th>会话</th><th>项目路径</th><th class="num">消息数</th><th>最后更新</th><th>来源设备</th></tr></thead>
          <tbody id="sessBody"></tbody>
        </table>
      </div>
      <div id="listEmpty" class="empty-state hidden">暂无会话</div>
    </div>

    <div id="detailView" class="hidden">
      <button class="btn back" id="btnBack">← 返回列表</button>
      <div id="sessHead" class="sess-head"></div>
      <div id="msgList"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>
</main>
<div class="footer">pi-cloud-sync · 用量来自各客户端同步到服务器的会话数据 · 金额为各模型供应商计价</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('pisync_token') || '';
  const S = {
    days: 7, device: '', model: '', trendMetric: 'tokens',
    stats: null, sessions: [], curUuid: null, curOffset: 0, curTotal: 0,
    autoTimer: null, loading: false,
  };
  const PAGE = 500;
  const serverOrigin = location.origin;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function truncate(s, n) { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function fmtTime(ts) { return ts ? new Date(ts).toLocaleString() : '-'; }
  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(Math.round(n));
  }
  function fmtFull(n) { return (Number(n) || 0).toLocaleString('en-US'); }
  function fmtCost(n) {
    n = Number(n) || 0;
    if (n === 0) return '$0.00';
    if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (n >= 1) return '$' + n.toFixed(2);
    if (n >= 0.01) return '$' + n.toFixed(3);
    return '$' + n.toFixed(4);
  }
  async function api(path) {
    const res = await fetch(serverOrigin + path, { headers: { 'Authorization': 'Bearer ' + token } });
    const j = await res.json().catch(() => ({ ok: false, message: 'HTTP ' + res.status }));
    if (!res.ok || !j.ok) { const e = new Error(j.message || j.error || 'HTTP ' + res.status); e.status = res.status; throw e; }
    return j.data;
  }

  /* ---------- theme ---------- */
  const THEME_KEY = 'pisync_theme';
  const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const saved = localStorage.getItem(THEME_KEY) || 'system';
    const dark = saved === 'dark' || (saved === 'system' && mqDark.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('themeSelect').value = saved;
  }
  $('themeSelect').onchange = (e) => {
    localStorage.setItem(THEME_KEY, e.target.value);
    applyTheme();
  };
  // 跟随系统时监听系统主题变化
  if (mqDark.addEventListener) mqDark.addEventListener('change', applyTheme);
  applyTheme();

  /* ---------- init ---------- */
  function init() {
    $('serverLabel').textContent = serverOrigin;
    if (token) { connect(); } else { showTokenPrompt(); }
  }
  function showTokenPrompt() {
    $('tokenPrompt').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('btnLogout').classList.add('hidden');
    $('btnRefresh').classList.add('hidden');
  }
  function showApp() {
    $('tokenPrompt').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('btnLogout').classList.remove('hidden');
    $('btnRefresh').classList.remove('hidden');
  }
  async function connect() {
    try {
      await api('/api/v1/health');
      localStorage.setItem('pisync_token', token);
      showApp();
      switchTab('overview');
      await refreshAll();
    } catch (e) {
      localStorage.removeItem('pisync_token');
      $('tokenTitle').textContent = e.status === 401 ? '令牌无效，请重新输入' : '连接失败：' + e.message;
      showTokenPrompt();
    }
  }

  /* ---------- tabs ---------- */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('tab-overview').classList.toggle('hidden', name !== 'overview');
    $('tab-sessions').classList.toggle('hidden', name !== 'sessions');
  }

  /* ---------- stats ---------- */
  async function loadStats() {
    if (S.loading) return; S.loading = true;
    const q = new URLSearchParams();
    q.set('days', String(S.days));
    if (S.device) q.set('device', S.device);
    if (S.model) q.set('model', S.model);
    try {
      const data = await api('/api/v1/web/stats?' + q);
      S.stats = data;
      renderStats();
    } catch (e) {
      $('statCards').innerHTML = `<div class="card-mini" style="grid-column:1/-1"><div class="k">统计加载失败</div><div class="v" style="color:var(--err)">${esc(e.message)}</div></div>`;
    } finally { S.loading = false; }
  }

  function renderStats() {
    fillFilterOptions();
    const s = S.stats;
    if (!s) return;
    const sum = s.summary;
    const rangeLabel = { 1: '近 1 天', 7: '近 7 天', 30: '近 30 天', all: '全部时间' }[String(S.days)];
    const filterLabel = [S.device ? `设备「${S.device}」` : '', S.model ? `模型「${S.model}」` : ''].filter(Boolean).join(' · ');
    $('rangeNote').textContent = [rangeLabel, filterLabel, S.device || S.model ? '' : '· 全部客户端聚合'].filter(Boolean).join(' ');

    const cards = [
      { k: '总 Token', v: fmtNum(sum.totalTokens), d: `输入 ${fmtNum(sum.input)} / 输出 ${fmtNum(sum.output)}`, tint: 'var(--accent)', full: fmtFull(sum.totalTokens) + ' tokens' },
      { k: '消费金额', v: fmtCost(sum.cost), d: '按模型供应商计价', tint: 'var(--warn)', full: '$' + (Number(sum.cost) || 0).toFixed(4) },
      { k: '请求次数', v: fmtNum(sum.requests), d: 'assistant / toolResult', tint: 'var(--violet)', full: fmtFull(sum.requests) },
      { k: '会话数', v: fmtNum(sum.sessions), d: '有用量数据的会话', tint: 'var(--ok)', full: fmtFull(sum.sessions) },
      { k: '客户端数', v: fmtNum(sum.devices), d: '范围内容量设备', tint: 'var(--pink)', full: fmtFull(sum.devices) },
    ];
    $('statCards').innerHTML = cards.map(c => `
      <div class="card-mini" style="--tint:${c.tint}" title="${esc(c.full)}">
        <div class="k">${c.k}</div><div class="v">${c.v}</div><div class="d">${c.d}</div>
      </div>`).join('');

    renderTrend();
    renderModel();
    renderDevice();
    renderRecent();
  }

  /* ---------- daily trend chart ---------- */
  function niceCeil(v) {
    if (v <= 0) return 1;
    const exp = Math.floor(Math.log10(v));
    const base = Math.pow(10, exp);
    const f = v / base;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * base;
  }
  function downsample(points, max = 60) {
    if (points.length <= max) return points;
    const size = Math.ceil(points.length / max);
    const out = [];
    for (let i = 0; i < points.length; i += size) {
      const chunk = points.slice(i, i + size);
      out.push({
        date: chunk[0].date,
        total: chunk.reduce((a, c) => a + c.total, 0),
        cost: chunk.reduce((a, c) => a + c.cost, 0),
        requests: chunk.reduce((a, c) => a + (c.requests || 0), 0),
      });
    }
    return out;
  }
  function renderTrend() {
    const el = $('trendChart');
    const pts = downsample(S.stats.byDay);    if (pts.length === 0) { el.innerHTML = '<div class="empty-state">该时间范围内暂无用量数据</div>'; $('trendTitle').textContent = ''; return; }
    const metric = S.trendMetric;
    const W = 720, H = 250, padL = 58, padR = 12, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const values = pts.map(p => metric === 'cost' ? (p.cost || 0) : (p.total || 0));
    const maxV = niceCeil(Math.max(...values, 1));
    const n = pts.length, step = iw / n, bw = Math.max(2.5, step * 0.62);
    const ticks = 4;
    let g = `<defs>
      <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4cc2ff"/><stop offset="100%" stop-color="#1a4a68"/>
      </linearGradient>
      <linearGradient id="costGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#6b4a0d"/>
      </linearGradient>
    </defs>`;
    for (let i = 0; i <= ticks; i++) {
      const v = maxV * i / ticks;
      const y = padT + ih - (i / ticks) * ih;
      g += `<line class="grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`;
      g += `<text class="axis" x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${metric === 'cost' ? '$' + (v >= 1 ? v.toFixed(0) : v.toFixed(2)) : fmtNum(v)}</text>`;
    }
    const labelEvery = Math.max(1, Math.ceil(n / 12));
    pts.forEach((p, i) => {
      const v = values[i];
      const h = (v / maxV) * ih;
      const x = padL + i * step + (step - bw) / 2;
      const y = padT + ih - h;
      const cls = v === 0 ? 'bar zero' : 'bar ' + metric;
      const tip = `${p.date}\n${metric === 'cost' ? '$' + (Number(p.cost) || 0).toFixed(4) + ' 成本' : fmtFull(p.total) + ' tokens'}\n请求 ${fmtFull(p.requests || 0)}`;
      g += `<rect class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}" ${bw > 5 ? 'rx="3"' : ''}><title>${esc(tip)}</title></rect>`;
      if (i % labelEvery === 0 || i === n - 1) {
        g += `<text class="axis" x="${(x + bw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${p.date.slice(5)}</text>`;
      }
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日用量趋势图">${g}</svg>`;
    const total = values.reduce((a, b) => a + b, 0);
    $('trendTitle').textContent = `合计 ${metric === 'cost' ? fmtCost(total) : fmtFull(total) + ' tokens'} · ${n} 天`;
  }

  /* ---------- horizontal bars ---------- */
  function hbars(el, rows, labelKey, valueKey, cls, fmt) {
    if (!rows.length) { el.innerHTML = '<div class="empty-state">暂无数据</div>'; return; }
    const maxV = Math.max(...rows.map(r => r[valueKey]), 1);
    const top = rows.slice(0, 8);
    el.innerHTML = top.map(r => {
      const label = r[labelKey] || '(unknown)';
      return `<div class="hbar-row" title="${esc(label)} · ${fmt(r[valueKey])}">
        <div class="hbar-label">${esc(truncate(label, 22))}</div>
        <div class="hbar-track"><div class="hbar-fill ${cls}" style="width:${((r[valueKey] / maxV) * 100).toFixed(1)}%"></div></div>
        <div class="hbar-val">${fmt(r[valueKey])}</div>
      </div>`;
    }).join('');
  }

  /* ---------- breakdown tables ---------- */
  function breakdownTable(el, rows, labelKey, title) {
    if (!rows.length) { el.innerHTML = ''; return; }
    const body = rows.map(r => {
      const label = r[labelKey] || '(unknown)';
      return `<tr>
        <td>${esc(truncate(label, 40))}</td>
        <td class="num">${fmtFull(r.requests)}</td>
        <td class="num">${fmtNum(r.input)}</td>
        <td class="num">${fmtNum(r.output)}</td>
        <td class="num tok-cell">${fmtFull(r.total)}</td>
        <td class="num cost-cell">${fmtCost(r.cost)}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `<thead><tr><th>${title}</th><th class="num">请求</th><th class="num">输入</th><th class="num">输出</th><th class="num">Tokens</th><th class="num">金额</th></tr></thead><tbody>${body}</tbody>`;
  }

  function renderModel() {
    const rows = S.stats.byModel;
    $('modelBars').innerHTML = '';
    hbars($('modelBars'), rows, 'model', 'total', '', fmtNum);
    $('modelNote').textContent = rows.length > 8 ? `共 ${rows.length} 个模型，显示前 8 个` : '';
    breakdownTable($('modelTable'), rows, 'model', '模型');
  }
  function renderDevice() {
    const rows = S.stats.byDevice;
    $('deviceBars').innerHTML = '';
    hbars($('deviceBars'), rows, 'device', 'total', 'violet', fmtNum);
    $('deviceNote').textContent = rows.length > 8 ? `共 ${rows.length} 个客户端，显示前 8 个` : '';
    breakdownTable($('deviceTable'), rows, 'device', '客户端');
  }

  /* ---------- recent sessions ---------- */
  function renderRecent() {
    const el = $('recentList');
    const rows = S.sessions.filter(s => !s.deleted).slice(0, 8);
    if (!rows.length) { el.innerHTML = '<div class="empty-state">暂无会话</div>'; return; }
    el.innerHTML = rows.map(s => `
      <div class="recent-item" data-uuid="${esc(s.uuid)}">
        <div class="icon">💬</div>
        <div class="t">
          <div class="name">${esc(s.name || s.uuid.slice(0, 8))}</div>
          <div class="meta">${esc(truncate(s.cwd, 46))} · ${fmtTime(s.updatedAt)}</div>
        </div>
        <div class="cnt">${fmtFull(s.entryCount)} 条</div>
      </div>`).join('');
    el.querySelectorAll('.recent-item').forEach(item => {
      item.onclick = () => { switchTab('sessions'); openSession(item.dataset.uuid); };
    });
  }

  /* ---------- sessions ---------- */
  async function loadSessions() {
    try { S.sessions = await api('/api/v1/web/sessions'); renderList(); } catch (e) { /* ignore */ }
  }
  function renderList() {
    const q = $('searchInput').value.trim().toLowerCase();
    const showDel = $('showDeleted').checked;
    const rows = S.sessions.filter(s => {
      if (!showDel && s.deleted) return false;
      if (!q) return true;
      return (s.name || '').toLowerCase().includes(q) || s.cwd.toLowerCase().includes(q) || s.uuid.toLowerCase().includes(q);
    });
    const body = $('sessBody');
    body.innerHTML = '';
    $('listEmpty').classList.toggle('hidden', rows.length > 0);
    for (const s of rows) {
      const tr = document.createElement('tr');
      tr.className = 'clickable';
      const name = s.name || s.uuid.slice(0, 8);
      tr.innerHTML = `
        <td><strong>${esc(name)}</strong>${s.deleted ? ' <span class="badge deleted">已删除</span>' : ''}
          <div class="muted" style="font-size:11px">${esc(s.uuid)}</div></td>
        <td class="muted">${esc(s.cwd)}</td>
        <td class="num">${fmtFull(s.entryCount)}</td>
        <td class="muted">${fmtTime(s.updatedAt)}</td>
        <td class="muted">${esc(s.updatedBy)}</td>`;
      tr.onclick = () => openSession(s.uuid);
      body.appendChild(tr);
    }
  }
  async function openSession(uuid) {
    S.curUuid = uuid; S.curOffset = 0;
    $('listView').classList.add('hidden');
    $('detailView').classList.remove('hidden');
    await loadDetail();
  }
  async function loadDetail() {
    const d = await api(`/api/v1/web/sessions/${S.curUuid}?limit=${PAGE}&offset=${S.curOffset}`);
    S.curTotal = d.total;
    const name = d.name || d.uuid.slice(0, 8);
    $('sessHead').innerHTML = `
      <h2>${esc(name)} ${d.deleted ? '<span class="badge deleted">已删除</span>' : ''}</h2>
      <div class="muted">${esc(d.uuid)} · ${esc(d.cwd)}</div>
      <div class="muted">共 ${fmtFull(d.total)} 条 · 更新于 ${fmtTime(d.updatedAt)} · 来源 ${esc(d.updatedBy)}</div>`;
    const list = $('msgList');
    list.innerHTML = '';
    if (d.entries.length === 0) { list.innerHTML = '<div class="empty-state">该会话暂无条目</div>'; }
    for (const e of d.entries) {
      const cls = e.role ? 'role-' + e.role : 'type-' + e.type;
      const roleTag = e.role ? e.role : e.type;
      const model = e.model ? esc(e.model) : '';
      let usage = '';
      if (e.usage && (e.usage.totalTokens > 0 || e.usage.cost > 0)) {
        usage = ` · <span class="usage"><span class="tok">${fmtFull(e.usage.totalTokens)} tok</span> · <span class="cst">${fmtCost(e.usage.cost)}</span></span>`;
      }
      const tool = e.toolName ? ` · ${esc(e.toolName)}` : '';
      const time = e.ts ? fmtTime(e.ts) : '';
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = `
        <div class="msg-head">
          <span class="role-tag">${esc(roleTag)}</span>
          <span class="muted">${model}${tool}${usage}</span>
          <span class="meta">${time}</span>
        </div>
        <div class="msg-body">${e.text ? esc(e.text) : (e.summary ? esc(e.summary) : '')}</div>`;
      list.appendChild(div);
    }
    const pager = $('pager');
    pager.innerHTML = '';
    if (S.curOffset > 0) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '← 上一页'; b.onclick = () => { S.curOffset = Math.max(0, S.curOffset - PAGE); loadDetail(); window.scrollTo(0, 0); }; pager.appendChild(b); }
    if (S.curOffset + PAGE < S.curTotal) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '下一页 →'; b.onclick = () => { S.curOffset += PAGE; loadDetail(); window.scrollTo(0, 0); }; pager.appendChild(b); }
  }
  function showList() {
    $('detailView').classList.add('hidden');
    $('listView').classList.remove('hidden');
    renderList();
  }

  /* ---------- refresh ---------- */
  async function refreshAll() {
    await Promise.all([loadStats(), loadSessions()]);
  }
  function setupAutoRefresh() {
    clearInterval(S.autoTimer);
    if ($('autoRefresh').checked) S.autoTimer = setInterval(refreshAll, 30000);
  }

  /* ---------- events ---------- */
  document.querySelectorAll('#rangeChips .chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      S.days = chip.dataset.days === 'all' ? 'all' : parseInt(chip.dataset.days, 10);
      loadStats();
    };
  });
  $('deviceSelect').onchange = (e) => { S.device = e.target.value; loadStats(); };
  $('modelSelect').onchange = (e) => { S.model = e.target.value; loadStats(); };
  document.querySelectorAll('#trendMetric button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#trendMetric button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      S.trendMetric = b.dataset.metric;
      renderTrend();
    };
  });
  $('btnRefresh').onclick = refreshAll;
  $('autoRefresh').onchange = setupAutoRefresh;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

  $('btnToken').onclick = () => { token = $('tokenInput').value.trim(); if (token) connect(); };
  $('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') { token = $('tokenInput').value.trim(); if (token) connect(); } });
  $('btnLogout').onclick = () => { localStorage.removeItem('pisync_token'); token = ''; $('tokenInput').value = ''; showTokenPrompt(); };
  $('btnBack').onclick = showList;
  $('searchInput').addEventListener('input', renderList);
  $('showDeleted').addEventListener('change', renderList);

  // 加载统计后填充筛选下拉（保持选择）
  function fillFilterOptions() {
    if (!S.stats) return;
    const devSel = $('deviceSelect'), modelSel = $('modelSelect');
    const devVal = devSel.value, modelVal = modelSel.value;
    devSel.innerHTML = '<option value="">全部客户端</option>' + S.stats.devices.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    modelSel.innerHTML = '<option value="">全部模型</option>' + S.stats.models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (S.stats.devices.includes(devVal)) devSel.value = devVal;
    if (S.stats.models.includes(modelVal)) modelSel.value = modelVal;
  }

  init();
})();
</script>
</body>
</html>
